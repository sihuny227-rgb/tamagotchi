<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff9fc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다마고치">
<meta name="description" content="지온이와 하온이의 동물 친구 키우기 게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>지온·하온 다마고치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* what the claude.ai page wrapper used to provide */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,.chip,.opt,.act{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<style>
:root{
  /* Layout: one centred column. An egg-shaped toy on top, care meters and a button tray below; games slide up as sheets. One bright toy-box look on purpose (no dark variant). */
  --sky-top:#cde8fb; --sky-bottom:#fde6ef;
  --ink:#3a2b40; --ink-soft:#7a6880;
  --paper:#ffffff; --paper-2:#fff8fb; --line:#efdfe8;
  --good:#4fbf83; --warn:#ffae34; --bad:#ff6470; --gold:#ffc93c;
  --shell:#ff9fc4; --shell-deep:#e46e9b; --shell-soft:#ffd8e7;
  --wall-a:#fff5f9; --wall-b:#ffe9f2; --floor:#f2cfa8; --floor-line:#e2b78b;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom)) fixed;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #6aa8ff;outline-offset:2px}
.app{max-width:460px;margin-inline:auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:20px;border:2.5px solid transparent;background:rgba(255,255,255,.55);cursor:pointer;text-align:left;min-width:0}
.tab[aria-selected="true"]{background:#fff;border-color:var(--tab-c);box-shadow:0 4px 0 var(--tab-c)}
.tab-rabbit{--tab-c:#ff9fc4}.tab-cat{--tab-c:#ffb062}
.tab .face{width:46px;height:46px;flex:none}
.tab .face svg{width:100%;height:100%}
.tab .who{min-width:0}
.tab b{font-family:var(--font-display);font-weight:400;font-size:18px;display:block}
.tab small{display:block;color:var(--ink-soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .alert{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px;display:grid;place-items:center;font-family:var(--font-display)}

/* device */
.device{position:relative;width:100%;margin-inline:auto;margin-top:14px;background:radial-gradient(circle at 30% 18%,var(--shell-soft),var(--shell) 62%);border-radius:50% 50% 42% 42% / 26% 26% 18% 18%;padding:44px 26px 22px;box-shadow:inset 0 -10px 0 var(--shell-deep),inset 0 6px 0 rgba(255,255,255,.5),0 18px 30px -14px rgba(80,40,70,.45)}
.device::before{content:"";position:absolute;top:-16px;left:50%;width:34px;height:34px;transform:translateX(-50%);border-radius:50%;border:7px solid var(--shell-deep);background:transparent}
.device-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 6px 8px;font-family:var(--font-display);color:#fff;text-shadow:0 2px 0 var(--shell-deep)}
.pet-title{font-size:19px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:6px;flex:none}
.snd-btn{width:34px;height:34px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 var(--shell-deep);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0;position:relative}
.snd-btn.off{opacity:.55}
.snd-btn.off::after{content:"";position:absolute;width:24px;height:3px;background:var(--bad);border-radius:2px;transform:rotate(-45deg)}
.coins{flex:none;background:#fff;color:#a8760a;text-shadow:none;border-radius:999px;padding:3px 12px 3px 8px;font-size:17px;box-shadow:0 3px 0 var(--shell-deep);font-variant-numeric:tabular-nums}
.screen{position:relative;aspect-ratio:1/.9;width:100%;border-radius:28px;overflow:hidden;border:6px solid rgba(255,255,255,.75);box-shadow:inset 0 0 0 2px rgba(0,0,0,.05);background:var(--wall-a);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.wall{position:absolute;inset:0 0 30% 0;background:repeating-linear-gradient(90deg,var(--wall-a) 0 20px,var(--wall-b) 20px 40px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,var(--floor) 0 46px,var(--floor-line) 46px 48px);box-shadow:inset 0 6px 0 rgba(0,0,0,.06)}
.rug{position:absolute;left:50%;bottom:7%;width:56%;height:13%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,var(--shell-soft) 55%,var(--shell) 56% 64%,var(--shell-soft) 65%)}
.window{position:absolute;top:9%;left:7%;width:24%;aspect-ratio:1;border-radius:14px;border:5px solid #fff;background:linear-gradient(#9fd6ff,#d9f0ff);box-shadow:0 3px 0 rgba(0,0,0,.06);overflow:hidden}
.window::before{content:"";position:absolute;top:18%;right:16%;width:32%;aspect-ratio:1;border-radius:50%;background:#ffd84d;box-shadow:0 0 0 5px rgba(255,216,77,.35)}
.window::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#fff 47% 53%,transparent 53%),linear-gradient(transparent 47%,#fff 47% 53%,transparent 53%)}
.frame{position:absolute;top:12%;right:9%;width:17%;aspect-ratio:4/5;border-radius:6px;border:4px solid #c99c6e;background:#fff;display:grid;place-items:center;font-size:clamp(14px,4.5vw,22px)}
.night .window{background:linear-gradient(#1d2a5c,#3b4a8a)}
.night .window::before{background:#fff4b8;box-shadow:inset -8px -2px 0 0 #1d2a5c;border-radius:50%}
.night::after{content:"";position:absolute;inset:0;background:rgba(22,26,74,.42);pointer-events:none;z-index:3}
.poops{position:absolute;inset:0;z-index:2;pointer-events:none}
.poop{position:absolute;font-size:clamp(22px,7vw,32px);transform:translateX(-50%);pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;line-height:1}
.poop::after{content:"〰";position:absolute;left:50%;top:-60%;transform:translateX(-50%);font-size:.55em;color:#8ab35a;animation:stink 1.4s ease-in-out infinite}
.poop.new{animation:poopin .35s ease-out 1s backwards}
.pet-wrap{position:absolute;left:50%;bottom:6%;width:54%;transform:translateX(-50%);z-index:2;cursor:grab;touch-action:none;transition:left 1.2s ease-in-out,bottom .38s cubic-bezier(.55,0,.85,.4)}
.pet-wrap.drag{transition:none;cursor:grabbing;z-index:7}
.pet-dir{transition:transform .25s}
.pet{transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.pet svg{display:block;width:100%;height:auto;overflow:visible;pointer-events:none}
.pet.hop{animation:hop .5s ease-out}
.pet.jumping{animation:hop .55s ease-out infinite}
.pet.walking{animation:walkbob .42s ease-in-out infinite}
.pet.held{animation:dangle .6s ease-in-out infinite}
.pet.shiver{animation:shiver .1s linear infinite}
.pet.strain{animation:strain .22s ease-in-out infinite}
.pet.spin{animation:spin .7s ease-in-out}
.pet.sway{animation:sway 1.8s ease-in-out}
.pet.wiggle{animation:wiggle .8s ease-in-out}
.pet.sigh{animation:sigh 1.5s ease-in-out}
.pet.stretch{animation:stretch 1s ease-in-out}
.pet.nom{animation:nom .3s ease-in-out 5}
.pet.squash{animation:squash .35s ease-out}
.night .pet{animation:breathe 3.6s ease-in-out infinite}
.night .pet.sway{animation:sway 1.8s ease-in-out}
.pet.dipping{animation:dip .5s ease-in-out infinite}
.pet.scrub{animation:wiggle .9s ease-in-out infinite}
.tub{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);z-index:3;pointer-events:none;animation:popup .35s ease-out}
.bowl{position:absolute;bottom:1%;width:27%;transform:translateX(-50%);z-index:3;pointer-events:none;animation:bowlin .35s ease-out}
.bowl.out{animation:bowlout .35s ease-in forwards}
.foam{position:absolute;left:50%;width:46%;transform:translateX(-50%);pointer-events:none;z-index:1;animation:popup .3s ease-out}
.tub svg,.bowl svg,.foam svg{display:block;width:100%;height:auto}
.toy{position:absolute;transform:translate(-50%,-50%);font-size:30px;line-height:1;pointer-events:none;z-index:4}
.toy svg{display:block;width:100%;height:auto}
.t-bounce{transform:none;bottom:14%;animation:ballbounce 1.1s ease-in-out infinite}
.t-roll{transform:none;bottom:5%;animation:rollx 2.2s ease-in-out infinite}
.t-float{animation:floaty 2.2s ease-in-out infinite}
.t-float::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:26px;background:#a58aa8}
.t-hug{transform:translateX(-50%);bottom:7%;width:20%}
.t-hug.toss{animation:toss .9s ease-out}
.t-squeak{transform:translateX(-50%);bottom:5%;font-size:34px}
.t-squeak.sq{animation:sq .3s ease-out}
.t-fly{font-size:34px;animation:flyarc 1.6s ease-in-out infinite alternate}
.t-bubble{font-size:24px;animation:bubbleup 2s ease-out forwards}
.shop-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.dress-preview{width:130px;margin:0 auto 8px}
.food .em svg{width:40px;height:40px;display:block}
.food .own{font-size:13px;color:var(--good)}
.shop-item.worn{border-color:var(--shell-deep);background:var(--shell-soft)}
.shop-item[aria-disabled="true"]{opacity:.5}
.paci{transform-box:fill-box;transform-origin:50% 30%;animation:suck 1.3s ease-in-out infinite}
@keyframes suck{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
.clinic{position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(90deg,#effbf7 0 22px,#e3f6ef 22px 44px)}
.c-sign{position:absolute;top:7%;left:6%;background:#fff;border-radius:12px;padding:4px 10px;font-family:var(--font-display);font-size:clamp(13px,4vw,17px);color:#d8424f;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.c-chart{position:absolute;top:8%;right:8%;font-size:clamp(22px,7vw,32px)}
.c-floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,#d6ece6 0 30px,#cfe5df 30px 32px),#d6ece6}
.c-doc{position:absolute;right:4%;bottom:6%;font-size:clamp(50px,16vw,76px);line-height:1;animation:docin .4s ease-out}
.prop{position:absolute;transform:translate(-50%,-50%);font-size:clamp(28px,9vw,40px);line-height:1;z-index:4;pointer-events:none;animation:popin .25s ease-out}
.prop.poke{animation:poke .8s ease-in forwards}
.vet-card{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:20px;border:2.5px solid var(--line);background:var(--paper-2);cursor:pointer;width:100%}
.vet-card .em{font-size:36px;text-align:center}
.vet-card b{font-family:var(--font-display);font-weight:400;font-size:19px}
.vet-card small{color:var(--ink-soft);font-size:13.5px;display:block}
.vet-card .due{background:var(--bad);color:#fff;border-radius:999px;padding:2px 10px;font-family:var(--font-display);font-size:14px;white-space:nowrap}
.vet-card .ok{color:var(--good);font-family:var(--font-display);font-size:14px;white-space:nowrap}
.booklet{margin-top:14px;background:#fffbea;border:2px dashed #f0d77a;border-radius:18px;padding:12px 14px}
.booklet b{font-family:var(--font-display);font-weight:400;font-size:18px}
.stickers{font-size:22px;letter-spacing:2px;margin:6px 0;overflow-wrap:anywhere}
.booklet ul{margin:6px 0 0;padding-left:18px;color:var(--ink-soft);font-size:14px}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px}
.pause-btn{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:6px 14px;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--line);cursor:pointer}
.time-chip{margin-right:auto;font-family:var(--font-display);font-size:14px;background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.time-chip.low{background:#ffe1e4;color:#c7404b}
.pause-screen{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 10%,#3d4a8f,#1b2152 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:24px;text-align:center;overflow:auto}
.pause-screen h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.pause-screen p{margin:0;color:#dfe3ff;max-width:34ch}
.pause-screen .moon{font-size:46px;line-height:1}
.p-pets{display:flex;gap:6px;justify-content:center}
.p-pets>div{width:min(36vw,130px)}
.p-pets svg{width:100%;height:auto;display:block}
.p-time{font-family:var(--font-display);font-size:16px}
.parent-box{background:rgba(255,255,255,.12);border-radius:20px;padding:14px;display:grid;gap:10px;width:min(100%,360px)}
.parent-box label,.parent-box .lbl{font-family:var(--font-display);font-size:18px}
.parent-box input{font:inherit;font-size:20px;padding:8px 12px;border-radius:14px;border:0;width:100%;min-width:0;color:var(--ink);background:#fff}
.pb-row{display:flex;gap:8px}
.pb-row .big-btn{font-size:17px;padding:10px 16px;flex:none}
.limit-opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pause-screen .tool{color:var(--ink)}
.pause-screen .err{color:#ffb3ba}
.buddy .bubble{margin-bottom:34px;background:#fffbe6}
.buddy .bubble::after{border-top-color:#fffbe6}
.chat-log{display:flex;flex-direction:column;gap:8px;height:min(46vh,360px);overflow-y:auto;background:var(--paper-2);border-radius:18px;padding:12px}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg-row.me{justify-content:flex-end}
.msg-bub{max-width:78%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:#fff;box-shadow:0 2px 0 var(--line);overflow-wrap:anywhere;font-size:15.5px;line-height:1.45}
.me .msg-bub{border-radius:16px 16px 4px 16px;background:var(--shell-soft)}
.msg-face{width:36px;flex:none}
.msg-face svg{width:100%;height:auto;display:block}
.typing span{display:inline-block;font-size:10px;margin-inline:1px;animation:dotty 1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.chat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chat-form{display:flex;gap:8px;margin-top:10px}
.chat-form input{flex:1;min-width:0;font:inherit;font-size:17px;padding:9px 12px;border-radius:14px;border:2.5px solid var(--line);background:#fff;color:var(--ink)}
.chat-form .big-btn{font-size:17px;padding:9px 16px;flex:none}
.profile-top{display:flex;gap:14px;align-items:center}
.profile-face{width:110px;flex:none}
.profile-face svg{width:100%;height:auto;display:block}
.p-name{font-family:var(--font-display);font-size:26px}
.info-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:14px 0 0;font-size:15.5px}
.info-grid dt{color:var(--ink-soft);white-space:nowrap}
.info-grid dd{margin:0;font-family:var(--font-display);font-size:16.5px;min-width:0}
.info-grid dd small{font-family:var(--font-body);font-size:13px;color:var(--ink-soft)}
.g-inline{display:flex;gap:6px;flex-wrap:wrap}
.gender-pick{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.gender-pick .g-lbl{font-family:var(--font-display);font-size:16px;flex:none}
.g-btn{flex:1;padding:7px 10px;border-radius:14px;border:2.5px solid var(--line);background:var(--paper-2);font-family:var(--font-display);font-size:16px;cursor:pointer;color:var(--ink)}
.g-btn[aria-pressed="true"]{border-color:var(--c,var(--shell));background:#fff;box-shadow:0 3px 0 var(--c,var(--shell))}
.grow-chart{margin-top:14px;background:var(--paper-2);border-radius:16px;padding:10px 12px}
.grow-chart b{font-family:var(--font-display);font-weight:400;font-size:16px}
.grow-chart svg{width:100%;height:auto;display:block;margin-top:6px}
.blk-board,#board{touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.blk-pane.minus{background:#fff0f1;box-shadow:inset 0 0 0 3px var(--bad)}
.blk-tools2{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;align-items:center}
.blk-mode{font-family:var(--font-display);font-size:15px;padding:9px 12px;border-radius:16px;background:#eef7ff;color:#2f6db0;text-align:center}
.blk-mode.minus{background:#ffe6e9;color:#c7404b}
.tail{transform-box:fill-box;transform-origin:10% 95%;animation:wag 1.4s ease-in-out infinite}
.flies{position:absolute;inset:0;pointer-events:none}
.flies span{position:absolute;top:20%;left:50%;font-size:16px;animation:orbit 2.2s linear infinite}
.flies span:nth-child(2){animation-duration:3s;animation-direction:reverse;top:35%}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:-4px;background:#fff;border-radius:16px;padding:6px 12px;font-family:var(--font-display);font-size:clamp(13px,3.8vw,16px);white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.08);z-index:4;pointer-events:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff}
.zzz{position:absolute;top:14%;right:20%;z-index:5;font-family:var(--font-display);color:#fff;font-size:24px;pointer-events:none}
.zzz span{position:absolute;opacity:0;animation:zz 2.4s ease-in infinite}
.zzz span:nth-child(2){animation-delay:.8s;font-size:.8em}
.zzz span:nth-child(3){animation-delay:1.6s;font-size:.6em}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.particle{position:absolute;font-size:26px;transform:translate(-50%,-50%);animation:floatup 1.2s ease-out forwards}
.tap-ring{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.08);transform:translate(-50%,-50%);animation:ring .5s ease-out forwards}
.ball{position:absolute;bottom:14%;font-size:30px;animation:ballbounce 1.1s ease-in-out infinite}
.toast{position:absolute;left:50%;bottom:4%;transform:translate(-50%,10px);background:rgba(58,43,64,.86);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;max-width:92%;text-align:center;opacity:0;transition:opacity .25s,transform .25s;z-index:8;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint-line{text-align:center;color:var(--ink);opacity:.78;font-size:13.5px;line-height:1.5;margin:26px 0 14px;padding-inline:8px;text-wrap:balance}

/* outdoor walk scene */
.outdoor{position:absolute;inset:0;z-index:1;background:linear-gradient(#8fd3ff,#d8f3ff 66%)}
.o-sun{position:absolute;top:8%;right:10%;width:16%;aspect-ratio:1;border-radius:50%;background:#ffd84d;box-shadow:0 0 0 8px rgba(255,216,77,.3)}
.o-clouds{position:absolute;top:10%;left:0;width:200%;display:flex;justify-content:space-around;font-size:34px;animation:scroll 14s linear infinite}
.o-strip{position:absolute;bottom:28%;left:0;width:200%;display:flex;justify-content:space-around;align-items:flex-end;font-size:44px;animation:scroll 5s linear infinite}
.o-grass{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#8fd46a,#6dbf55)}
.o-path{position:absolute;left:0;right:0;bottom:8%;height:10%;background:#e8cf9c}

.device-bottom{display:flex;align-items:center;gap:10px;padding:10px 6px 0;color:#fff;font-family:var(--font-display)}
.stage-chip{flex:none;background:#fff;color:var(--shell-deep);border-radius:999px;padding:2px 12px;font-size:15px;box-shadow:0 3px 0 var(--shell-deep)}
.grow{flex:1;min-width:0}
.grow-label{display:flex;justify-content:space-between;font-size:13px;text-shadow:0 1px 0 var(--shell-deep)}
.grow-track{height:10px;border-radius:999px;background:rgba(255,255,255,.45);overflow:hidden;margin-top:2px}

/* stats */
.stats{background:var(--paper);border-radius:22px;padding:12px 16px;display:grid;gap:7px;box-shadow:0 4px 0 var(--line);margin-bottom:20px}

/* actions */

.act:disabled{opacity:.45;cursor:default}
.act .ico{font-size:28px;line-height:1}
.act .lbl{font-family:var(--font-display);font-size:14.5px;white-space:nowrap}
.act .need{position:absolute;top:-6px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--bad);border:2px solid #fff;animation:pulse 1s ease-in-out infinite}

/* setup */

.sp-btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 2px;border-radius:14px;border:2.5px solid var(--line);background:var(--paper-2);cursor:pointer;min-width:0}

.sp-btn span{font-size:13px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sp-btn[aria-pressed="true"]{border-color:var(--c);background:#fff;box-shadow:0 3px 0 var(--c)}
.setup-card .face{grid-row:span 3;width:88px}
.setup-card label{font-family:var(--font-display);font-size:18px}
.setup-card input{width:100%;min-width:0;font:inherit;font-size:18px;padding:9px 12px;border-radius:14px;border:2.5px solid var(--line);background:var(--paper-2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:#f6eef3;border-radius:999px;padding:3px 11px;font-size:14px;cursor:pointer}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(58,43,64,.45);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.sheet-card{position:relative;background:#fff;border-radius:28px;width:100%;max-width:440px;padding:20px 18px 18px;box-shadow:0 20px 40px -10px rgba(40,20,50,.4);animation:rise .25s ease-out;margin:auto}
.sheet-card h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0 40px 4px 0}
.sheet-card .sub{color:var(--ink-soft);margin:0 0 14px}
.close-x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#f4ecf1;font-size:20px;cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.food{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:18px;border:2.5px solid var(--line);background:var(--paper-2);cursor:pointer}
.food .em{font-size:36px;line-height:1.1}
.food .nm{font-family:var(--font-display);font-size:16px}

.food .fav{font-size:11.5px;color:var(--shell-deep)}
.food:disabled{opacity:.4;cursor:default}
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game-card{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:12px 8px;border-radius:20px;border:2.5px solid var(--line);background:var(--paper-2);cursor:pointer;width:100%;min-width:0}

.stack{display:grid;gap:10px}
.hud{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-size:17px;margin-bottom:10px;font-variant-numeric:tabular-nums}

.rps-arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--paper-2);border-radius:22px;padding:14px 8px}

.rps-vs{font-family:var(--font-display);font-size:22px;color:var(--ink-soft)}
.rps-face{width:54px}
.msg{font-family:var(--font-display);font-size:21px;text-align:center;min-height:1.6em;margin:12px 0}
.rps-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rps-btn{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:20px;border:2.5px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer}

.word-q{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper-2);border-radius:22px;padding:16px}
.word-q .big-em{font-size:88px;line-height:1.1}
.word-q .big-word{font-family:var(--font-display);font-size:46px;letter-spacing:.02em}
.word-q .hint{color:var(--ink-soft)}
.say{border:0;background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.opts.four{grid-template-columns:repeat(2,1fr)}
.opt{min-height:74px;padding:8px 4px;border-radius:18px;border:2.5px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer;font-family:var(--font-display);font-size:22px;overflow-wrap:anywhere}

.voice-row{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}

.voice-row select{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 10px;border-radius:12px;border:2.5px solid var(--line);background:#fff;color:var(--ink)}

.orchard{position:relative;width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:linear-gradient(#bfe6ff,#e9f8ff 62%,#9ad67a 62%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.trunk{position:absolute;left:44%;width:12%;bottom:12%;height:40%;background:#9a6a3f;border-radius:10px}
.leaf{position:absolute;border-radius:50%;background:#5cb85c}
.leaf.l2{background:#6cc96a}
.apple{position:absolute;transform:translate(-50%,-50%);font-size:clamp(30px,10vw,42px);background:none;border:0;padding:12px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;animation:popin .2s ease-out;line-height:1}
.apple.gone{animation:drop .45s ease-in forwards;pointer-events:none}

.plus{position:absolute;font-family:var(--font-display);font-size:22px;transform:translate(-50%,-50%);animation:floatup .8s ease-out forwards;pointer-events:none}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px;margin-top:10px}

/* block puzzle */
.blk-target{background:#eef7ff;border-radius:20px;padding:10px;text-align:center}
.blk-target svg{width:min(100%,230px);height:auto;display:block;margin-inline:auto}
.pane-lbl{font-family:var(--font-display);font-size:15.5px;display:block}
.blk-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.blk-tools{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:10px}
.tool{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:9px 4px;font-family:var(--font-display);font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tool.on{border-color:var(--shell-deep);background:var(--shell-soft)}
.tool.go{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 #1e1424}
.count-line{display:flex;justify-content:center;gap:14px;font-size:14.5px;color:var(--ink-soft);margin-top:8px;font-variant-numeric:tabular-nums}

/* math */
.math-box{background:var(--paper-2);border-radius:22px;padding:16px 10px;text-align:center}
.math-q{font-family:var(--font-display);font-size:50px;line-height:1.1;font-variant-numeric:tabular-nums}
.counters{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 3px;font-size:22px;margin-top:8px;max-width:100%}
.counters .op{font-family:var(--font-display);font-size:24px;margin-inline:6px;color:var(--ink-soft)}
.counters .out{opacity:.28;position:relative}
.counters .out::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-size:20px;opacity:1}

/* dice race */
.board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,auto);gap:5px}
.cell{position:relative;aspect-ratio:1;border-radius:12px;background:var(--paper-2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(16px,5vw,22px);min-width:0}
.cell .no{position:absolute;top:1px;left:5px;font-size:11px;color:var(--ink-soft)}
.cell.goal{background:#fff4c9;border-color:#f0c64a}
.cell.start{background:#e9f8ef;border-color:#a8dcbc}
.cell.coin{background:#fff8e1}.cell.star{background:#eef3ff}.cell.banana{background:#fff3e6}
.tok{position:absolute;width:52%;bottom:2%;transition:none;line-height:1}
.tok.me{left:0;font-size:clamp(18px,6vw,26px);text-align:center}
.tok.pt{right:0}
.tok.pt svg{width:100%;height:auto;display:block}
.dice-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.die{width:72px;flex:none}
.die svg{width:100%;height:auto;display:block}

.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .face{width:150px}
.result .reward{font-family:var(--font-display);font-size:30px;color:#a8760a}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:60;pointer-events:none;animation:confetti 2.2s linear forwards}
.settings-row{display:grid;gap:8px;margin-bottom:16px}
.settings-row label{font-family:var(--font-display);font-size:17px}
.settings-row input{font:inherit;font-size:17px;padding:9px 12px;border-radius:14px;border:2.5px solid var(--line);width:100%}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .big-btn{font-size:17px;padding:10px 16px;flex:1}
.danger{background:var(--bad)!important;box-shadow:0 5px 0 #c7404b!important}

const BGM=(()=>{
  let muted=false;
  try{muted=localStorage.getItem(LS_KEY+"-music")==="1"}catch(e){}
  let want="home",playing=null,step=0,next=0,timer=null,out=null,unlocked=false,paused=false;
  // melodies are MIDI numbers on eighth-note steps (0 = rest); bass is one entry per quarter note
  const TR={
    home:{bpm:104,mw:"triangle",mv:0.055,bw:"sine",bv:0.07,len:1.6,
      mel:[72,0,76,0,79,0,76,0, 77,0,81,0,79,0,0,0, 76,0,79,0,84,0,79,0, 81,79,76,0,0,0,0,0, 74,0,77,0,81,0,77,0, 79,0,77,76,74,0,0,0, 72,0,76,0,79,0,76,0, 72,0,0,0,0,0,0,0],
      bass:[48,55,52,55, 53,60,57,60, 48,55,52,55, 53,57,55,59, 50,57,53,57, 55,62,59,62, 48,55,52,55, 48,43,48,0]},
    walk:{bpm:138,mw:"square",mv:0.028,bw:"triangle",bv:0.07,len:1.2,
      mel:[67,0,71,0,74,0,71,0, 72,0,76,0,79,0,76,0, 74,0,78,0,81,0,78,74, 79,0,0,0,74,0,0,0, 67,71,74,71,67,71,74,0, 72,76,79,76,72,76,79,0, 74,78,81,78,74,72,71,69, 67,0,0,0,0,0,0,0],
      bass:[43,50,43,50, 48,55,48,55, 50,57,50,57, 43,50,43,50, 43,50,43,50, 48,55,48,55, 50,57,50,57, 43,50,43,0]},
    sleep:{bpm:70,mw:"sine",mv:0.045,bw:"sine",bv:0.035,len:3.4,
      mel:[81,0,0,0,77,0,0,0, 72,0,0,0,77,0,0,0, 79,0,0,0,76,0,0,0, 72,0,0,0,76,0,0,0, 77,0,0,0,81,0,0,0, 79,0,0,0,77,0,0,0, 76,0,0,0,74,0,0,0, 72,0,0,0,0,0,0,0],
      bass:[53,0,60,0, 48,0,55,0, 53,0,60,0, 48,0,55,0, 53,0,60,0, 48,0,55,0, 48,0,55,0, 53,0,0,0]},
    game:{bpm:152,mw:"square",mv:0.026,bw:"triangle",bv:0.07,len:0.9,
      mel:[72,72,79,79,81,79,76,72, 74,74,81,81,83,81,77,74, 76,79,84,79,76,79,84,79, 74,76,77,74,79,0,67,0],
      bass:[48,48,55,55, 50,50,57,57, 48,52,55,52, 43,43,43,0]}
  };
  const m2f=m=>440*Math.pow(2,(m-69)/12);
  function blip(c,f,t,d,type,v){
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(out);o.start(t);o.stop(t+d+0.05);
  }
  function sched(){
    const c=actx,tr=TR[playing];if(!c||!tr||!out)return;
    const sd=60/tr.bpm/2;
    if(next<c.currentTime)next=c.currentTime+0.05;
    while(next<c.currentTime+0.3){
      const n=tr.mel[step%tr.mel.length];
      if(n)blip(c,m2f(n),next,sd*tr.len,tr.mw,tr.mv);
      if(step%2===0){const b=tr.bass[(step/2)%tr.bass.length];if(b)blip(c,m2f(b),next,sd*1.8,tr.bw,tr.bv)}
      next+=sd;step++;
    }
  }
  function stop(){
    if(timer){clearInterval(timer);timer=null}
    playing=null;
    if(out&&actx){const o=out;try{o.gain.cancelScheduledValues(actx.currentTime);o.gain.setTargetAtTime(0.0001,actx.currentTime,0.12)}catch(e){}setTimeout(()=>{try{o.disconnect()}catch(e){}},900)}
    out=null;
  }
  function apply(){
    if(muted||paused||!unlocked||!want||!TR[want]){stop();return}
    if(playing===want)return;
    stop();const c=getCtx();if(!c)return;
    out=c.createGain();out.gain.setValueAtTime(0.0001,c.currentTime);out.gain.exponentialRampToValueAtTime(1,c.currentTime+0.8);out.connect(c.destination);

  }
  return{
    set(n){if(want!==n){want=n;apply()}},
    unlock(){if(!unlocked){unlocked=true;apply()}},
    pause(v){paused=v;apply()},
    get muted(){return muted},
    toggle(){muted=!muted;try{localStorage.setItem(LS_KEY+"-music",muted?"1":"0")}catch(e){}apply();return muted}
  };
})();

/* ---------- state ---------- */
let state={v:1,pets:{rabbit:null,cat:null},current:"rabbit",savedAt:0};
let busy=false,walking=false,gameOn=false,temp=null,sayText="",sayUntil=0;
let lastPetKey="",lastPoopKey="",lastTabKeys={},toastTimer=null,sheetOpen=false,sheetOnClose=null;
let petX=50,facing=1,dragging=false,moveUntil=0,walkT=null;

function newPet(type,name,slot,gender){
  const now=Date.now();
  return {type,slot,gender:gender||null,chat:[],name,born:now,xp:0,stage:0,coins:30,hunger:80,happy:80,clean:100,energy:90,health:100,
    poops:[],poopMeter:20,sick:false,sleeping:false,drowsy:0,xpClock:0,lastTick:now,patAt:0,celebrate:false,
    count:{meals:0,games:0,walks:0},items:[],wear:{},sizeV:2,med:{checkAt:0,vaxAt:0,vaxCount:0,stickers:0,log:[]}};
}
const cur=()=>state.pets[state.current];
const stageFor=xp=>{let s=0;STAGES.forEach((st,i)=>{if(xp>=st.xp)s=i});return s};
function addXP(p,n){p.xp+=n;const s=stageFor(p.xp);if(s>p.stage){p.stage=s;p.celebrate=true}}

function addPoop(p,ev){
  p.poopMeter=0;
  if(p.poops.length>=4)return;
  const here=p===cur()&&!$("#main").hidden;
  p.poops.push({id:Math.random().toString(36).slice(2,8),x:here?clamp(petX+rand(-6,6),8,92):randi(10,90),y:here?randi(3,7):randi(3,16),t:Date.now()});
  p.clean=clamp(p.clean-10);
  ev&&ev.push("poop");
}
function simulate(p,mins,ev){
  let left=mins;
  while(left>0){
    const m=Math.min(1,left);left-=m;
    if(p.sleeping){
      p.energy+=6*m;p.hunger-=0.4*m;p.happy-=0.1*m;
      if(p.energy>=100){p.energy=100;p.sleeping=false;p.drowsy=0;addXP(p,3);ev&&ev.push("woke")}
    }else{
      p.hunger-=1.0*m;p.happy-=0.7*m;p.energy-=0.6*m;
    }
    p.clean-=(0.25+0.4*p.poops.length)*m;
    p.poopMeter+=0.8*m;
    if(p.poopMeter>=100)addPoop(p,ev);
    let dh=0;
    if(p.hunger<20)dh-=0.6;
    if(p.clean<30)dh-=0.4;
    dh-=0.3*p.poops.length;
    if(p.sick)dh-=0.3;
    if(dh===0&&p.hunger>50&&p.clean>50)dh=0.4;
    p.health+=dh*m*(dh<0&&vaxOn(p)?0.7:1);
    ["hunger","happy","clean","energy","health"].forEach(key=>p[key]=clamp(p[key]));
    if(!p.sick&&p.health<(vaxOn(p)?18:30)){p.sick=true;ev&&ev.push("sick")}
    p.xpClock=(p.xpClock||0)+m;
    while(p.xpClock>=10){p.xpClock-=10;if(!p.sick&&p.hunger>40&&p.happy>40)addXP(p,1)}
  }
}
function catchUp(){
  const now=Date.now();
  if(isPaused()){["rabbit","cat"].forEach(t=>{const p=state.pets[t];if(p)p.lastTick=now});return}
  ["rabbit","cat"].forEach(t=>{const p=state.pets[t];if(!p)return;
    const mins=(now-(p.lastTick||now))/60000;
    if(mins>0.05)simulate(p,Math.min(mins,150),null);
    p.lastTick=now});
}

/* ---------- mood & needs ---------- */
function moodOf(p){
  if(dragging&&!p.sleeping)return p.happy>45?"happy":"surprised";
  if(temp&&temp.until>Date.now()&&!p.sleeping)return temp.mood;
  if(p.sleeping)return "sleep";
  if(p.sick)return "sick";
  if(p.drowsy>=3||p.energy<25)return "sleepy";
  if(p.hunger<25||p.happy<25||p.clean<25)return "sad";
  if(p.happy>65&&p.hunger>45)return "happy";
  return "normal";
}
function needOf(p){
  if(p.sleeping)return null;
  if(p.sick)return "아파요… 약 주세요";
  if(p.poops.length)return "똥 쌌어요! 치워 주세요";
  if(p.hunger<30)return "배고파요…";
  if(p.drowsy>=3)return "이불 덮어 주세요";
  if(p.energy<25)return "졸려요… 토닥토닥";
  if(p.clean<35)return "찝찝해요, 씻고 싶어요";
  if(p.happy<35)return "심심해요! 놀아 주세요";
  if(medDue(p))return vaxDue(p)?"주사 맞으러 병원 가요 🏥":"건강검진 받을 때예요 🏥";
  return null;
}
const alerting=p=>p&&!p.sleeping&&(medDue(p)||p.sick||p.poops.length>0||p.hunger<30||p.energy<25||p.happy<35||p.clean<35);
function musicScene(){
  if(isPaused())return "none";
  if(!$("#setup").hidden)return "home";
  if(gameOn)return "game";
  if(walking)return "walk";
  const p=cur();
  if(p&&p.sleeping)return "sleep";
  return "home";
}

/* ---------- render ---------- */
function setMood(mood,ms){temp={mood,until:Date.now()+ms};render();setTimeout(render,ms+30)}
function say(text,ms){sayText=text;sayUntil=Date.now()+ms;render();setTimeout(render,ms+30)}
function buildStats(){
  $("#stats").innerHTML=STATS.map(([k,l])=>`<div class="stat"><span class="stat-name">${l}</span><div class="stat-track"><div class="stat-fill" id="sf-${k}"></div></div><span class="stat-num" id="sn-${k}"></span></div>`).join("");
}
function renderTabs(){
  ["rabbit","cat"].forEach(t=>{
    const p=state.pets[t],tab=$("#tab-"+t);
    tab.setAttribute("aria-selected",String(state.current===t));
    const key=p?p.stage+"|"+p.name+"|"+JSON.stringify(p.wear||{}):"none";
    if(lastTabKeys[t]!==key){lastTabKeys[t]=key;
      tab.querySelector(".face").innerHTML=p?petSVG(p.type,p.stage,"happy",{wear:p.wear,fit:true}):"";
      tab.querySelector("small").textContent=p?`${spOf(p).kind} ${p.name}`:"";if(p)tab.style.setProperty("--tab-c",spOf(p).shell[0])}
    let a=tab.querySelector(".alert");
    const show=state.current!==t&&alerting(p);
    if(show&&!a){a=document.createElement("span");a.className="alert";a.textContent="!";tab.appendChild(a)}
    if(!show&&a)a.remove();
  });
}
function render(){
  BGM.set(musicScene());
  const p=cur();if(!p||$("#main").hidden)return;
  const tg=together(),host=tg?state.pets[state.visit.host]:p;
  applyTheme(host.type);
  {const chip=$("#timeChip"),left=leftMs();chip.hidden=!isFinite(left);
   if(isFinite(left)){const m=Math.max(0,Math.ceil(left/60000));chip.textContent=`⏰ 오늘 남은 시간 ${m}분`;chip.classList.toggle("low",m<=3)}}

/* little life: wander, blink, react to how the pet feels */
function behave(){
  setTimeout(behave,rand(2400,4400));
  const p=cur();
  if(!p||busy||dragging||sheetOpen||$("#main").hidden||document.hidden||isPaused())return;
  if(Date.now()<moveUntil)return;
  if(temp&&temp.until>Date.now())return;
  const r=Math.random();
  if(p.sleeping){
    if(r<0.3)anim("sway",1800);
    else if(r<0.42)say(pick(["쿨쿨…","음냐음냐…","새근새근…"]),1800);
    return;
  }
  if(p.sick){
    if(r<0.45){anim("shiver",1400);say("콜록콜록…",1500);SFX.play("cough");burst("💦",2,{y:40})}
    else if(r<0.65){anim("shiver",1200);say("으슬으슬 추워요…",1500)}
    else if(r<0.8)walkTo(petX+rand(-10,10),110);
    return;
  }
  if(p.energy<25||p.drowsy>=3){
    if(r<0.45){setMood("yawn",1400);anim("sigh",1400);say("하아암~",1400);SFX.play("yawn")}
    else if(r<0.75)anim("sway",1800);
    else walkTo(petX+rand(-14,14),95);
    return;
  }
  if(p.poops.length&&r<0.45){
    const near=p.poops.reduce((a,b)=>Math.abs(b.x-petX)<Math.abs(a.x-petX)?b:a);
    setMood("surprised",1300);anim("wiggle",800);say(pick(["으~ 냄새!","똥 치워 주세요~","코를 막아요!"]),1500);
    setTimeout(()=>walkTo(near.x<petX?petX+25:petX-25,40),700);
    return;
  }
  if(p.hunger<30&&r<0.5){
    say(pick(["꼬르륵…","배고파요~","밥 언제 줘요?"]),1600);setMood("sad",1600);
    burst("💭",1,{y:30});walkTo(80,60);return;
  }
  if(p.clean<35&&r<0.4){anim("wiggle",900);say("간질간질…",1400);return}
  if(p.happy<35&&r<0.5){anim("sigh",1500);say("심심해…",1500);setMood("sad",1500);return}
  if(r<0.38)walkTo(rand(18,82));
  else if(r<0.5){hop();setMood("happy",900)}
  else if(r<0.6){setMood("wink",900);burst("✨",1,{y:35})}
  else if(r<0.68){anim("spin",700);setMood("happy",900)}
  else if(r<0.76){setMood("surprised",900);burst(pick(["❗","❓","🦋"]),1,{y:28})}
  else if(r<0.84){say(pick(["랄랄라~",`${PETS[p.slot].owner} 어디 있어?`,"오늘 기분 좋아!","히힛","같이 놀자!"]),1600);setMood("happy",1600)}
  else if(r<0.92){setDir(-facing);setTimeout(()=>setDir(-facing),700)}
  else anim("stretch",1000);
}

  "너는 꼬마라서 아주 쉬운 말로 짧게 한 문장(10단어 이하)만 말해. 어린 아이 말투(예: '나 이거 조아!')를 써도 돼.",
  "너는 어린이라서 쉬운 문장 1~2개로 또박또박 말해. 간단한 질문에 대답하고, 가끔 상대에게 되물어 봐.",
  "너는 다 큰 어른이라 말을 잘해. 다정하고 똑똑하게 2~3문장으로 대답해. 아이가 궁금해하는 것을 아주 쉽게 설명해 주고, 칭찬과 격려를 해 줘."
];
function chatPrompt(p,msg){
  const sp=spOf(p),owner=PETS[p.slot].owner,fav=(FOODS.find(f=>f.id===sp.fav)||{}).nm;
  const days=Math.floor((Date.now()-p.born)/86400000)+1;
  const feel=[];
  if(p.sleeping)feel.push("지금 졸려서 자다가 깼어");if(p.sick)feel.push("몸이 아파");
  if(p.hunger<30)feel.push("배가 고파");if(p.energy<25)feel.push("졸려");if(p.happy>70)feel.push("기분이 아주 좋아");else if(p.happy<35)feel.push("심심해");
  if(p.poops.length)feel.push("방에 똥이 있어서 냄새가 나");
  const hist=(p.chat||[]).slice(-9,-1).map(m=>`${m.r==="me"?owner:p.name}: ${m.t}`).join("\n");
  return `너는 어린이용 다마고치 게임 속 동물 친구야. 아래 캐릭터로 한국어로만 대답해.
- 이름: ${p.name} / 동물: ${sp.kind} / 성별: ${p.gender==="girl"?"여자아이":p.gender==="boy"?"남자아이":"정하지 않음"}
- 성장 단계: ${STAGES[p.stage].name} (태어난 지 ${days}일)
- 나를 키워 주는 친구: ${owner} (5~8살 어린이)
- 좋아하는 음식: ${fav} / 지금 상태: ${feel.join(", ")||"보통이야"}
말하는 능력(꼭 지켜): ${ABILITY[p.stage]}
규칙: 5~8살 어린이와 이야기하니까 다정하고 안전하게 말해. 무섭거나 어른스러운 이야기는 하지 마. 주소, 전화번호, 학교, 사진 같은 개인정보는 절대 묻지 마. 위험한 일은 하지 말고 엄마 아빠께 여쭤보라고 해. 모르는 건 모른다고 귀엽게 말해. 이모지는 0~1개만. 대답 문장만 써(이름표, 따옴표, 설명 없이).
${hist?`지금까지 나눈 이야기:\n${hist}\n`:""}${owner}: ${msg}
${p.name}:`;
}
function escRe(x){return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
async function petReply(p,msg){
  const smp=await getSampler();
  if(smp){
    try{
      const res=await smp(chatPrompt(p,msg),{modelTier:"quick",cache:false});
      let t=String(res&&res.text||"").trim();
      t=t.replace(new RegExp("^"+escRe(p.name)+"\\s*[:：]\\s*"),"").replace(/^["'“”‘’]+|["'“”‘’]+$/g,"");
      t=t.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,4).join(" ");
      if(t)return t.slice(0,240);
    }catch(e){
      if(e&&e.code==="rate_limited")return p.stage===0?"하암… 쿨쿨 💤":"조금 피곤해. 이따가 또 이야기하자!";
    }
  }
  return fallbackReply(p,msg);
}
function fallbackReply(p,msg){
  const st=p.stage,sp=spOf(p),owner=PETS[p.slot].owner,fav=(FOODS.find(f=>f.id===sp.fav)||{}).nm||"맛있는 거";
  if(st===0)return pick(["마마! 👶","맘마…","꺄르르~","바부바부!","응애!","조아! 💕","쪽쪽…","우쭈쭈~"]);
  const has=(...w)=>w.some(x=>msg.includes(x)),L=a=>a[Math.min(st,3)-1];
  if(has("안녕","하이","반가"))return L([`안녕! 나 ${p.name}!`,`안녕 ${owner}야! 반가워!`,`안녕, ${owner}. 오늘도 만나서 정말 반가워!`]);
  if(has("배고","먹","밥","간식","맛"))return p.hunger<40?L([`배고파! ${fav} 줘!`,`나 배고파… ${fav} 먹고 싶어!`,`사실 배가 조금 고파. ${fav} 먹으면 힘이 날 것 같아.`]):L([`${fav} 조아!`,`나는 ${fav}가 제일 좋아!`,`지금은 배불러. 그래도 제일 좋아하는 건 ${fav}야.`]);
  if(has("기분","어때","괜찮","아파"))return p.sick?L(["아야… 아파","몸이 아파… 약 주세요","조금 아파. 병원에 가면 금방 나을 거야."]):p.happy>60?L(["기분 조아!","나 지금 엄청 기분 좋아!",`${owner} 덕분에 기분이 아주 좋아. 고마워!`]):L(["심심해…","조금 심심해. 같이 놀자!","조금 심심했어. 같이 놀아 주면 금방 신날 거야."]);
  if(has("사랑","좋아해","최고"))return L(["나도 조아! 💕",`나도 ${owner} 사랑해! 💕`,`나도 ${owner}가 세상에서 제일 좋아. 💕`]);
  if(has("놀","게임","산책"))return L(["놀자 놀자!","좋아! 공놀이 하자!","좋아! 산책하고 나서 공놀이도 하자."]);
  if(has("졸","잘 자","자자","밤"))return L(["하암… 졸려","나도 졸려. 토닥토닥 해 줘","잘 자, 좋은 꿈 꿔. 내일 또 놀자!"]);
  if(has("이름","누구"))return L([`나 ${p.name}!`,`내 이름은 ${p.name}야!`,`나는 ${owner}의 ${sp.kind} ${p.name}야.`]);
  if(has("몇 살","나이"))return L(["나 꼬마!","나는 어린이야!","이제 다 컸어. 어른이 됐지!"]);
  return L([pick(["응!","헤헤!","우와!","진짜?"]),pick(["그렇구나! 신기하다!","우와, 더 얘기해 줘!","헤헤, 재밌다!"]),pick(["그렇구나, 정말 재미있는 이야기야.","우와, 그건 몰랐어! 더 알려 줄래?","좋은 생각이야. 같이 해 보자!"])]);
}
function greetFor(p){
  const owner=PETS[p.slot].owner;
  return [`응애~ 마마! 👶`,`안녕! 나 ${p.name}! 놀자!`,`안녕 ${owner}! 오늘 뭐 하고 놀까?`,`안녕, ${owner}. 오늘 하루는 어땠어? 이야기 들려줘 😊`][p.stage];
}
function openChat(p){
  SFX.play("tap");
  if(!Array.isArray(p.chat))p.chat=[];
  if(!p.chat.length)p.chat.push({r:"pet",t:greetFor(p)});
  const face=petSVG(p.type,p.stage,"happy",{fit:true,wear:p.wear});
  const ability=["아직 아기라서 옹알이만 해요. 쑥쑥 크면 말을 배워요!","꼬마라서 짧은 말을 해요.","어린이라서 또박또박 말해요.","어른이라서 무엇이든 잘 이야기해요."][p.stage];
  const QUICK=["안녕!","기분 어때?","뭐 먹고 싶어?","좋아하는 게 뭐야?","사랑해!","같이 놀자!"];
  openSheet(`<h2>💬 ${esc(p.name)}와 이야기하기</h2><p class="sub">${ability}</p>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="chat-chips">${QUICK.map(q=>`<button class="chip" type="button" data-q="${q}">${q}</button>`).join("")}</div>
    <form class="chat-form" id="chatForm"><input id="chatIn" maxlength="80" placeholder="${esc(p.name)}에게 말해 봐요" autocomplete="off"><button class="big-btn" type="submit">보내기</button></form>`);
  let waiting=false;
  const draw=()=>{
    const log=$("#chatLog");if(!log)return;
    log.innerHTML=p.chat.slice(-30).map(m=>m.r==="me"?`<div class="msg-row me"><div class="msg-bub">${esc(m.t)}</div></div>`:`<div class="msg-row"><span class="msg-face">${face}</span><div class="msg-bub">${esc(m.t)}</div></div>`).join("")
      +(waiting?`<div class="msg-row"><span class="msg-face">${face}</span><div class="msg-bub typing"><span>●</span><span>●</span><span>●</span></div></div>`:"");
    log.scrollTop=log.scrollHeight;
  };
  const send=async text=>{
    text=String(text||"").trim();if(!text||waiting)return;
    p.chat.push({r:"me",t:text.slice(0,80)});$("#chatIn").value="";waiting=true;draw();SFX.play("soft");
    const reply=await petReply(p,text);
    waiting=false;p.chat.push({r:"pet",t:reply});p.chat=p.chat.slice(-30);p.happy=clamp(p.happy+1);persist();
    if(live()&&$("#chatLog")){draw();SFX.play("pop")}
    say(reply.length>22?reply.slice(0,21)+"…":reply,2400);setMood(p.stage===0?"happy":"wink",1000);
  };
  $("#chatForm").addEventListener("submit",e=>{e.preventDefault();send($("#chatIn").value)});
  $("#sheetCard").querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>send(b.dataset.q)));
  draw();
}

/* ---------- actions ---------- */
function canPlay(p,what){
  const ok=canPlayInner(p,what);if(!ok)SFX.play("no");return ok;
}
function canPlayInner(p,what){
  if(p.sleeping){toast(`${josa(p.name,"이는","는")} 쿨쿨 자는 중이에요 💤`);return false}
  if(p.sick){toast(`아파서 ${what} 못 해요. 먼저 치료해 주세요 💊`);anim("shiver",900);return false}
  if(p.energy<15){toast("너무 졸려서 못 놀아요. 재워 주세요 🛏️");setMood("yawn",1200);return false}
  if(p.hunger<10){toast("배가 너무 고파요! 밥 먼저 주세요 🍚");setMood("sad",1200);return false}
  return true;
}

function closeSheet(){

}

function finishGame(p,title,earned,detail,lost){

/* ---------- game: rock paper scissors ---------- */
function gameRPS(p){
  gameOn=true;
  const H={rock:"✊",scissors:"✌️",paper:"✋"},N={rock:"바위",scissors:"가위",paper:"보"};
  const beats={rock:"scissors",scissors:"paper",paper:"rock"};
  let round=0,earned=0,wins=0,lock=false;
  openSheet(`<h2>가위바위보</h2><div class="hud"><span id="rpsRound">1 / 5 판</span><span class="earn" id="rpsEarn">🪙 0</span></div>
    <div class="rps-arena"><div class="rps-side"><div class="rps-hand" id="meHand">❔</div><span>나</span></div><div class="rps-vs">VS</div>
    <div class="rps-side"><div class="rps-hand" id="petHand">❔</div><span class="rps-face">${petSVG(p.type,p.stage,"happy",{wear:p.wear,fit:true})}</span></div></div>
    <div class="msg" id="rpsMsg">무엇을 낼까요?</div>
    <div class="rps-btns">${["scissors","rock","paper"].map(k=>`<button class="rps-btn" type="button" data-k="${k}"><span class="em">${H[k]}</span><span>${N[k]}</span></button>`).join("")}</div>`,
    partial(p,()=>earned));
  const btns=$("#sheetCard").querySelectorAll("[data-k]");
  btns.forEach(b=>b.addEventListener("click",()=>play(b.dataset.k)));
  function play(me){
    if(lock)return;lock=true;
    btns.forEach(b=>b.disabled=true);
    const mh=$("#meHand"),ph=$("#petHand"),msg=$("#rpsMsg");
    mh.textContent="✊";ph.textContent="✊";mh.classList.add("shake");ph.classList.add("shake");
    const seq=["가위!","바위!","보!"];let i=0;
    const iv=setInterval(()=>{
      if(!live()||!$("#rpsMsg")){clearInterval(iv);return}
      if(i<3){msg.textContent=seq[i++];SFX.play("tick");return}
      clearInterval(iv);mh.classList.remove("shake");ph.classList.remove("shake");
      const pc=pick(["rock","scissors","paper"]);mh.textContent=H[me];ph.textContent=H[pc];
      if(me===pc){earned+=1;msg.textContent="비겼어요! 🪙 +1";SFX.play("draw")}
      else if(beats[me]===pc){earned+=4;wins++;msg.textContent="이겼어요! 🎉 🪙 +4";SFX.play("win")}
      else{msg.textContent=`${josa(p.name,"이가","가")} 이겼어요! 다시 해 봐요`;SFX.play("lose")}
      round++;$("#rpsEarn").textContent="🪙 "+earned;
      setTimeout(()=>{
        if(!live()||!$("#rpsMsg"))return;
        if(round>=5){finishGame(p,"가위바위보 끝!",earned,`5판 중 ${wins}판 이겼어요!`);return}
        lock=false;$("#rpsRound").textContent=`${round+1} / 5 판`;msg.textContent="한 번 더! 무엇을 낼까요?";mh.textContent="❔";ph.textContent="❔";btns.forEach(b=>b.disabled=false);
      },1300);
    },380);
  }
}

  const n=(v.name+" "+v.voiceURI).toLowerCase(),l=(v.lang||"").toLowerCase().replace("_","-");
  if(!l.startsWith("en"))return -1;
  let s=l==="en-us"?30:l==="en-gb"?24:/^en-(au|ca|ie|nz)/.test(l)?16:8;
  if(/natural|neural|online|premium|enhanced|wavenet/.test(n))s+=50;

  return s;
}

  try{voiceList=(speechSynthesis.getVoices()||[]).filter(v=>scoreVoice(v)>=0).sort((a,b)=>scoreVoice(b)-scoreVoice(a))}catch(e){voiceList=[]}

  },1000);

function isoSVG(h,n,o){

  const pts=arr=>arr.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ");
  const col=o.blue?["#bfe3ff","#7cc0f2","#4f9bd9"]:["#ffe2a3","#f7b955","#e0913a"];
  let s="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const tile=pts([P(c,r,0),P(c+1,r,0),P(c+1,r+1,0),P(c,r+1,0)]);
    if(o.board){
      const v=h[r][c],fill=["#ffffff","#ffe7b8","#ffcf7a","#ffb547"][v];
      s+=`<polygon points="${tile}" fill="${fill}" stroke="#d6b88f" stroke-width="2" data-r="${r}" data-c="${c}"/>`;
      const [tx,ty]=P(c+0.5,r+0.5,0);
      s+=`<text x="${tx}" y="${ty+a*0.2}" text-anchor="middle" font-family="Jua, sans-serif" font-size="${a*0.62}" fill="${v?"#5a3a10":"#cdb89a"}" pointer-events="none">${v}</text>`;
    }else s+=`<polygon points="${tile}" fill="#f4ede4" stroke="#e0d2c0" stroke-width="1.5"/>`;
  }
  if(!o.board){
    const cubes=[];
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)for(let z=0;z<h[r][c];z++)cubes.push([r,c,z]);
    cubes.sort((A,B)=>(A[0]+A[1])-(B[0]+B[1])||A[2]-B[2]);
    cubes.forEach(([r,c,z])=>{
      s+=`<polygon points="${pts([P(c,r+1,z+1),P(c+1,r+1,z+1),P(c+1,r+1,z),P(c,r+1,z)])}" fill="${col[2]}" stroke="#7a5a2a" stroke-opacity=".35" stroke-width="1.2"/>`;
      s+=`<polygon points="${pts([P(c+1,r,z+1),P(c+1,r+1,z+1),P(c+1,r+1,z),P(c+1,r,z)])}" fill="${col[1]}" stroke="#7a5a2a" stroke-opacity=".35" stroke-width="1.2"/>`;
      s+=`<polygon points="${pts([P(c,r,z+1),P(c+1,r,z+1),P(c+1,r+1,z+1),P(c,r+1,z+1)])}" fill="${col[0]}" stroke="#7a5a2a" stroke-opacity=".35" stroke-width="1.2"/>`;
    });
  }
  const W=n*a+6,top=o.board?-6:-(maxH*hz+6),bottom=2*n*b+(o.board?26:24);
  s+=`<text x="0" y="${2*n*b+18}" text-anchor="middle" font-family="Jua, sans-serif" font-size="14" fill="#7a6880">👀 앞</text>`;
  return `<svg viewBox="${-W} ${top} ${2*W} ${bottom-top}" xmlns="http://www.w3.org/2000/svg" ${o.board?'class="blk-board"':'aria-hidden="true"'}>${s}</svg>`;
}
function genShape(n,max){
  for(let t=0;t<200;t++){
    const h=[...Array(n)].map(()=>Array(n).fill(0));
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const up=Math.min(max,r>0?h[r-1][c]:max,c>0?h[r][c-1]:max);
      h[r][c]=r===0&&c===0?randi(Math.max(1,max-1),max):randi(0,up);
    }
    const tot=h.flat().reduce((x,y)=>x+y,0);
    if(tot>=3&&tot<n*n*max)return h;
  }
  return n===2?[[2,1],[1,0]]:[[2,1,1],[1,1,0],[1,0,0]];
}
function gameBlocks(p){
  gameOn=true;
  const LEVELS=[[2,2],[2,2],[3,2],[3,2],[3,3]];
  let li=0,earned=0,tries=0,minus=false,mine,target,n,max,solved=0;
  const total=h=>h.flat().reduce((x,y)=>x+y,0);
  function level(){
    [n,max]=LEVELS[li];target=genShape(n,max);mine=[...Array(n)].map(()=>Array(n).fill(0));tries=0;minus=false;
    openSheet(`<h2>쌓기나무</h2><div class="hud"><span>${li+1} / ${LEVELS.length} 문제</span><span class="earn" id="bEarn">🪙 ${earned}</span></div>
      <div class="blk-target"><span class="pane-lbl">이 모양을 똑같이 만들어요</span>${isoSVG(target,n,{blue:true})}</div>
      <div class="blk-row">
        <div class="blk-pane"><span class="pane-lbl">내가 만든 모양</span><div id="myModel"></div></div>
        <div class="blk-pane" id="boardPane"><span class="pane-lbl" id="boardLbl">눌러서 쌓기</span><div id="board"></div></div>
      </div>
      <div class="count-line"><span>필요한 블록 ${total(target)}개</span><span id="myCount">쌓은 블록 0개</span></div>
      <div class="blk-tools2"><div class="blk-mode" id="bMode">👆 누르면 쌓기 · 꾹 누르면 빼기</div><button class="tool go" type="button" id="tCheck">다 했어요!</button></div>
      <div class="msg" id="bMsg">숫자는 그 칸에 쌓은 블록 수예요</div>`,partial(p,()=>earned));
    gameOn=true;
    draw();setMinus(false,true);
    const board=$("#board");let lp=null,skipUntil=0;
    const tileAt=t=>{const el=t&&t.closest&&t.closest("[data-r]");return el?{r:+el.dataset.r,c:+el.dataset.c}:null};
    const startPress=(target,x,y)=>{
      if(lp)return;const tile=tileAt(target);if(!tile)return;
      lp={...tile,x,y,timer:setTimeout(()=>{if(!lp)return;lp.fired=true;
        if(minus)setMinus(false);else{setMinus(true);removeAt(tile.r,tile.c)}
      },480)};
    };
    const movePress=(x,y)=>{if(lp&&!lp.fired&&Math.hypot(x-lp.x,y-lp.y)>14){clearTimeout(lp.timer);lp=null}};
    const endPress=()=>{if(!lp)return;clearTimeout(lp.timer);if(lp.fired)skipUntil=Date.now()+450;lp=null};
    board.addEventListener("pointerdown",e=>startPress(e.target,e.clientX,e.clientY));
    board.addEventListener("touchstart",e=>{const t=e.touches[0];if(t)startPress(e.target,t.clientX,t.clientY)},{passive:true});
    board.addEventListener("pointermove",e=>movePress(e.clientX,e.clientY));
    board.addEventListener("touchmove",e=>{const t=e.touches[0];if(t)movePress(t.clientX,t.clientY)},{passive:true});
    ["pointerup","pointercancel","touchend","touchcancel","mouseup"].forEach(t=>board.addEventListener(t,endPress));
    board.addEventListener("click",e=>{
      if(Date.now()<skipUntil||(lp&&lp.fired))return;
      const tile=tileAt(e.target);if(!tile)return;
      const {r,c}=tile;
      if(minus)removeAt(r,c);
      else{if(mine[r][c]<3){mine[r][c]++;SFX.play("block")}else{SFX.play("no");$("#bMsg").textContent="한 칸에 3개까지 쌓을 수 있어요"}draw()}
    });
    board.addEventListener("contextmenu",e=>e.preventDefault());
    $("#tCheck").addEventListener("click",check);
  }
  function removeAt(r,c){if(mine[r][c]>0){mine[r][c]--;SFX.play("unblock")}else{SFX.play("no");$("#bMsg").textContent="그 칸에는 뺄 블록이 없어요"}draw()}
  function setMinus(on,quiet){
    minus=on;
    const pane=$("#boardPane"),mode=$("#bMode"),lbl=$("#boardLbl");if(!pane)return;
    pane.classList.toggle("minus",on);mode.classList.toggle("minus",on);
    mode.textContent=on?"➖ 빼기 중 · 꾹 누르면 다시 쌓기":"👆 누르면 쌓기 · 꾹 누르면 빼기";
    lbl.textContent=on?"눌러서 빼기":"눌러서 쌓기";
    if(!quiet){SFX.play(on?"unblock":"block");$("#bMsg").textContent=on?"빼기 모드예요! 누르는 칸의 블록이 하나씩 빠져요":"다시 쌓기 모드예요"}
  }
  function draw(){
    $("#myModel").innerHTML=isoSVG(mine,n,{});
    $("#board").innerHTML=isoSVG(mine,n,{board:true,big:true});
    $("#myCount").textContent=`쌓은 블록 ${total(mine)}개`;
  }
  function check(){
    const ok=target.every((row,r)=>row.every((v,c)=>v===mine[r][c]));
    if(ok){
      const gain=tries===0?4:2;earned+=gain;solved++;SFX.play("correct");
      $("#bMsg").textContent=`똑같아요! 🎉 🪙 +${gain}`;$("#bEarn").textContent="🪙 "+earned;
      $("#sheetCard").querySelectorAll(".tool").forEach(b=>b.disabled=true);
      $("#board").style.pointerEvents="none";
      setTimeout(()=>{if(!live()||!$("#bMsg"))return;li++;
        if(li>=LEVELS.length){const bonus=solved===LEVELS.length&&earned>=LEVELS.length*4?5:0;earned+=bonus;finishGame(p,"쌓기나무 끝!",earned,`${solved}개의 모양을 만들었어요!${bonus?" 한 번에 다 맞힌 보너스 🪙 +5":""}`)}
        else level()},1400);
    }else{
      tries++;SFX.play("wrong");
      const diff=total(target)-total(mine);
      $("#bMsg").textContent=diff>0?`블록이 ${diff}개 모자라요. 다시 봐요!`:diff<0?`블록이 ${-diff}개 많아요. 빼 볼까요?`:"개수는 맞아요! 놓은 자리를 다시 봐요";
    }
  }
  level();
}

/* ---------- game: addition & subtraction ---------- */
function gameMath(p){
  gameOn=true;
  const LV={easy:{nm:"쉬움",sub:"10까지 · 5~6살",max:10,coin:2,em:"🐣"},mid:{nm:"보통",sub:"20까지 · 7살",max:20,coin:3,em:"🐥"},hard:{nm:"어려움",sub:"50까지 · 8살",max:50,coin:3,em:"🦅"}};
  openSheet(`<h2>더하기 빼기</h2><p class="sub">어떤 단계로 할까요?</p><div class="stack">${Object.entries(LV).map(([k,v])=>`<button class="game-card" type="button" data-lv="${k}" style="flex-direction:row;justify-content:center;gap:12px"><span class="em">${v.em}</span><span><b>${v.nm}</b><br><small>${v.sub}</small></span></button>`).join("")}</div>`);
  gameOn=true;
  $("#sheetCard").querySelectorAll("[data-lv]").forEach(b=>b.addEventListener("click",()=>{SFX.play("tap");run(b.dataset.lv)}));
  function make(lv){
    const plus=Math.random()<0.5;let a,b;
    if(lv==="easy"){if(plus){a=randi(1,8);b=randi(1,10-a)}else{a=randi(2,10);b=randi(1,a)}}
    else if(lv==="mid"){if(plus){a=randi(3,15);b=randi(2,20-a)}else{a=randi(6,20);b=randi(2,a-1)}}
    else{if(plus){a=randi(10,38);b=randi(3,50-a)}else{a=randi(15,50);b=randi(3,a-2)}}
    return {a,b,plus,ans:plus?a+b:a-b};
  }
  function run(lv){
    const L=LV[lv];let qi=0,earned=0,right=0;
    const show=()=>{
      const q=make(lv);
      const cand=new Set([q.ans]);
      const deltas=shuffle(lv==="hard"?[1,2,10,-1,-2,-10,3]:[1,2,-1,-2,3,-3]);
      for(const d of deltas){if(cand.size>=4)break;const v=q.ans+d;if(v>=0)cand.add(v)}
      let extra=q.ans+4;while(cand.size<4)cand.add(extra++);
      const opts=shuffle([...cand]);
      const fruit=(FOODS.find(f=>f.id===spOf(p).fav)||FOODS[1]).em;
      let counters="";
      if(lv==="easy"){
        counters=q.plus
          ?`<div class="counters">${("<span>"+fruit+"</span>").repeat(q.a)}<span class="op">+</span>${("<span>"+fruit+"</span>").repeat(q.b)}</div>`
          :`<div class="counters">${Array(q.a-q.b).fill("<span>"+fruit+"</span>").join("")}${Array(q.b).fill('<span class="out">'+fruit+'</span>').join("")}</div>`;
      }
      openSheet(`<h2>더하기 빼기 <small style="font-size:16px;color:var(--ink-soft)">${L.nm}</small></h2><div class="hud"><span>${qi+1} / 10 문제</span><span class="earn" id="mEarn">🪙 ${earned}</span></div>
        <div class="math-box"><div class="math-q">${q.a} ${q.plus?"+":"−"} ${q.b} = ?</div>${counters}</div>
        <div class="opts four">${opts.map(v=>`<button class="opt num" type="button" data-v="${v}">${v}</button>`).join("")}</div>
        <div class="msg" id="mMsg"></div>`,partial(p,()=>earned));
      gameOn=true;
      const btns=[...$("#sheetCard").querySelectorAll(".opt")];
      btns.forEach(b=>b.addEventListener("click",()=>{
        btns.forEach(x=>x.disabled=true);
        const v=+b.dataset.v;
        btns.find(x=>+x.dataset.v===q.ans).classList.add("ok");
        if(v===q.ans){SFX.play("correct");earned+=L.coin;right++;$("#mMsg").textContent=`정답! ${q.a} ${q.plus?"+":"−"} ${q.b} = ${q.ans} 🪙 +${L.coin}`}
        else{SFX.play("wrong");b.classList.add("no");$("#mMsg").textContent=`아쉬워요! 정답은 ${q.ans}`}
        $("#mEarn").textContent="🪙 "+earned;
        setTimeout(()=>{if(!live()||!$("#mMsg"))return;qi++;
          if(qi>=10){const bonus=right===10?5:0;earned+=bonus;finishGame(p,"더하기 빼기 끝!",earned,`10문제 중 ${right}개 맞혔어요!${bonus?" 만점 보너스 🪙 +5":""}`)}
          else show()},v===q.ans?1100:1800);
      }));
    };
    show();
  }
}

/* ---------- game: dice race ---------- */
function dieSVG(v){
  const P={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,25],[72,25],[28,50],[72,50],[28,75],[72,75]]}[v];
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="주사위 ${v}"><rect x="4" y="4" width="92" height="92" rx="20" fill="#fff" stroke="#3a2b40" stroke-width="5"/>${P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9.5" fill="${v===1?"#e2513d":"#3a2b40"}"/>`).join("")}</svg>`;
}
function gameDice(p){
  gameOn=true;
  const GOAL=19;
  const SPECIAL={3:"coin",6:"star",8:"coin",10:"banana",12:"coin",14:"star",17:"banana"};
  const ICON={coin:"🪙",star:"⭐",banana:"🍌"};
  const pos={me:0,pt:0};let coins=0,lock=false,over=false;
  const cellRC=i=>{const row=Math.floor(i/5),col=row%2===0?i%5:4-i%5;return [4-row,col+1]};
  openSheet(`<h2>주사위 달리기</h2><div class="hud"><span id="dTurn">내 차례!</span><span class="earn" id="dEarn">🪙 0</span></div>
    <div class="board" id="dBoard">${Array.from({length:20},(_,i)=>{const [gr,gc]=cellRC(i),sp=SPECIAL[i];return `<div class="cell ${sp||""}${i===0?" start":""}${i===GOAL?" goal":""}" style="grid-row:${gr};grid-column:${gc}" data-i="${i}"><span class="no">${i===0?"출발":i}</span>${i===GOAL?"🏁":sp?ICON[sp]:""}</div>`}).join("")}</div>
    <div class="legend"><span>🪙 코인 +2</span><span>⭐ 앞으로 2칸</span><span>🍌 미끄러져 뒤로 2칸</span></div>
    <div class="dice-row"><div class="die" id="die">${dieSVG(6)}</div><button class="big-btn" id="rollBtn" type="button">🎲 굴리기</button></div>
    <div class="msg" id="dMsg">🏁에 먼저 도착하면 이겨요!</div>`,()=>{over=true;if(coins>0){p.coins+=coins;persist();toast(`코인 ${coins}개를 받았어요!`)}});
  gameOn=true;
  const tok={me:document.createElement("span"),pt:document.createElement("span")};
  tok.me.className="tok me";tok.me.textContent="🧒";
  tok.pt.className="tok pt";tok.pt.innerHTML=petSVG(p.type,p.stage,"happy",{fit:true});
  const place=who=>{const cell=$(`#dBoard [data-i="${pos[who]}"]`);if(cell)cell.appendChild(tok[who])};
  place("me");place("pt");
  const alive=()=>!over&&live()&&$("#dBoard");
  const msg=t=>{const m=$("#dMsg");if(m)m.textContent=t};
  function roll(who,done){
    lock=true;$("#rollBtn").disabled=true;
    const die=$("#die");die.classList.add("rolling");SFX.play("roll");
    let f=0;const iv=setInterval(()=>{
      if(!alive()){clearInterval(iv);return}
      die.innerHTML=dieSVG(randi(1,6));
      if(++f>=8){clearInterval(iv);const v=randi(1,6);die.innerHTML=dieSVG(v);die.classList.remove("rolling");
        msg(`${who==="me"?"나":p.name}: ${v}! ${v}칸 가요`);
        setTimeout(()=>move(who,v,()=>special(who,done)),400)}
    },75);
  }
  function move(who,steps,done){
    const dir=steps<0?-1:1;let left=Math.abs(steps);
    const iv=setInterval(()=>{
      if(!alive()){clearInterval(iv);return}
      if(left<=0||(dir>0&&pos[who]>=GOAL)||(dir<0&&pos[who]<=0)){clearInterval(iv);done();return}
      pos[who]+=dir;left--;place(who);SFX.play("step");
    },260);
  }
  function special(who,done){
    if(pos[who]>=GOAL)return done();
    const sp=SPECIAL[pos[who]];
    if(sp==="coin"){if(who==="me"){coins+=2;$("#dEarn").textContent="🪙 "+coins;SFX.play("coin");msg("코인 칸! 🪙 +2")}else msg(`${josa(p.name,"이가","가")} 코인 칸에 멈췄어요`);setTimeout(done,700)}
    else if(sp==="star"){SFX.play("sparkle");msg("⭐ 별 칸! 앞으로 2칸 슝~");setTimeout(()=>move(who,2,done),600)}
    else if(sp==="banana"){SFX.play("lose");msg("🍌 미끄덩! 뒤로 2칸");setTimeout(()=>move(who,-2,done),600)}
    else done();
  }
  function end(who){
    over=true;sheetOnClose=null;
    if(who==="me"){SFX.play("win");const earned=coins+8;setTimeout(()=>finishGame(p,"내가 이겼어요! 🏁",earned,`먼저 도착 보너스 🪙 8 + 코인 칸 🪙 ${coins}`),700)}
    else{SFX.play("lose");const earned=coins+3;setTimeout(()=>finishGame(p,`${josa(p.name,"이가","가")} 먼저 왔어요`,earned,`그래도 잘했어요! 참가 🪙 3 + 코인 칸 🪙 ${coins}`,true),700)}
  }
  function myTurn(){
    roll("me",()=>{
      if(!alive())return;
      if(pos.me>=GOAL)return end("me");
      $("#dTurn").textContent=`${p.name} 차례`;
      setTimeout(()=>{if(!alive())return;
        roll("pt",()=>{
          if(!alive())return;
          if(pos.pt>=GOAL)return end("pt");
          $("#dTurn").textContent="내 차례!";lock=false;$("#rollBtn").disabled=false;msg("주사위를 굴려요!");
        })},900);
    });
  }
  $("#rollBtn").addEventListener("click",()=>{if(!lock)myTurn()});
}

}

/* ---------- setup ---------- */
const setupSel={rabbit:"rabbit",cat:"cat"},setupGender={rabbit:null,cat:null};
function renderSetupCard(slot){
  const sel=setupSel[slot],sp=SPECIES[sel];
  const card=$("#setup-"+slot);
  card.style.setProperty("--c",sp.shell[0]);
  card.querySelector(".species-pick").innerHTML=SPECIES_ORDER.map(t=>`<button class="sp-btn" type="button" data-sp="${t}" aria-pressed="${t===sel}">${petSVG(t,0,"happy",{fit:true})}<span>${SPECIES[t].kind}</span></button>`).join("");
  card.querySelectorAll("[data-sp]").forEach(b=>b.addEventListener("click",()=>{setupSel[slot]=b.dataset.sp;SFX.play("pop");renderSetupCard(slot)}));
  $("#setupFace-"+slot).innerHTML=petSVG(sel,0,"happy",{fit:true});
  $("#nameLbl-"+slot).textContent=`${PETS[slot].owner}의 ${sp.kind} 이름`;
  const chips=card.querySelector(".chips");
  chips.innerHTML=sp.chips.map(n=>`<button class="chip" type="button">${n}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{$("#name-"+slot).value=b.textContent;SFX.play("tap")}));
  card.querySelectorAll(".gender-pick .g-btn").forEach(b=>{b.setAttribute("aria-pressed",String(setupGender[slot]===b.dataset.g));b.onclick=()=>{setupGender[slot]=b.dataset.g;SFX.play("pop");renderSetupCard(slot)}});
}
function showSetup(){
  $("#main").hidden=true;$("#setup").hidden=false;
  ["--shell","--shell-deep","--shell-soft","--wall-a","--wall-b"].forEach(v=>document.body.style.removeProperty(v));
  SLOTS.forEach(slot=>{$("#setup-"+slot).hidden=!!state.pets[slot];if(!state.pets[slot])renderSetupCard(slot)});
}
$("#startBtn").addEventListener("click",()=>{
  const need=SLOTS.filter(t=>!state.pets[t]);
  for(const t of need){const v=$("#name-"+t).value.trim();if(!v){SFX.play("no");$("#setupErr").textContent=`${PETS[t].owner}의 ${SPECIES[setupSel[t]].kind} 이름을 지어 주세요!`;$("#name-"+t).focus();return}
    if(!setupGender[t]){SFX.play("no");$("#setupErr").textContent=`${PETS[t].owner}의 ${SPECIES[setupSel[t]].kind}는 남자일까요, 여자일까요? 성별을 골라 주세요!`;return}}
  need.forEach(t=>{state.pets[t]=newPet(setupSel[t],cleanName($("#name-"+t).value)||PETS[t].owner+"의 친구",t,setupGender[t]);$("#name-"+t).value="";setupGender[t]=null});
  $("#setupErr").textContent="";state.current=need[0]||state.current;persist();showMain();
  toast(`안녕! 나는 ${cur().name}야. 잘 부탁해 💕`);SFX.play("win");
});
function showMain(){$("#setup").hidden=true;$("#main").hidden=false;lastPetKey="";lastPoopKey="";lastTabKeys={};placePet(50,true);setDir(1);render()}

/* ---------- touch: tap floor to walk, drag to carry ---------- */
(function(){
  const screen=$("#screen"),wrap=$("#petWrap");
  let press=null;
  wrap.addEventListener("pointerdown",e=>{
    const p=cur();if(!p||busy)return;
    e.preventDefault();e.stopPropagation();
    try{wrap.setPointerCapture(e.pointerId)}catch(_){}
    press={x:e.clientX,y:e.clientY,id:e.pointerId,moved:false,lastX:e.clientX};
  });
  wrap.addEventListener("pointermove",e=>{
    if(!press||e.pointerId!==press.id)return;
    const p=cur();if(!p)return;
    if(!press.moved){
      if(Math.hypot(e.clientX-press.x,e.clientY-press.y)<9)return;
      if(p.sleeping){press=null;toast("쉿! 자고 있어요 🤫");SFX.play("pat");return}
      press.moved=true;dragging=true;wrap.classList.add("drag");$("#pet").classList.remove("walking");
      $("#pet").classList.add("held");SFX.play("lift");clearTimeout(walkT);render();
    }
    const rc=screen.getBoundingClientRect();
    const x=clamp((e.clientX-rc.left)/rc.width*100,12,88);
    const yb=clamp((rc.bottom-e.clientY)/rc.height*100-22,6,60);
    if(Math.abs(e.clientX-press.lastX)>3){setDir(e.clientX<press.lastX?-1:1);press.lastX=e.clientX}
    wrap.style.left=x+"%";wrap.style.bottom=yb+"%";petX=x;
  });
  const up=e=>{
    if(!press||e.pointerId!==press.id)return;
    const p=cur(),moved=press.moved;press=null;
    if(!p)return;
    if(moved){
      dragging=false;wrap.classList.remove("drag");$("#pet").classList.remove("held");
      const h=parseFloat(wrap.style.bottom)||6;
      wrap.style.bottom="6%";
      moveUntil=Date.now()+1500;
      setTimeout(()=>{anim("squash",360);SFX.play("drop");
        if(h>25){setMood(p.happy>45?"happy":"surprised",1200);say(p.happy>45?"또 해 줘요!":"깜짝이야!",1300)}
        p.happy=clamp(p.happy+1);render()},h>8?360:0);
      render();
    }else tapPet(p);
  };
  wrap.addEventListener("pointerup",up);
  wrap.addEventListener("pointercancel",up);

  screen.addEventListener("pointerdown",e=>{
    const p=cur();if(!p||busy||dragging)return;
    const pb=e.target.closest(".poop");
    if(pb){
      e.preventDefault();
      const idx=p.poops.findIndex(x=>x.id===pb.dataset.id);if(idx<0)return;
      const px=p.poops[idx].x;p.poops.splice(idx,1);p.clean=clamp(p.clean+12);addXP(p,1);
      burst(["✨","🫧"],3,{x:px,y:85});SFX.play("sparkle");
      if(!p.poops.length){toast("다 치웠어요! 반짝반짝 ✨");if(!p.sleeping)setMood("happy",1200)}
      persist();render();return;
    }
    if(e.target.closest("#buddyWrap")){
      const o=buddyPet();if(!o)return;
      if(o.sleeping){buddySays("쿨쿨… 💤",1200);SFX.play("pat");return}
      buddyAnim("hop",520);SFX.play("boing");buddyMoodFor(pick(["happy","wink"]),1000);
      buddySays(pick([`안녕 ${PETS[p.slot].owner}야!`,`${p.name}랑 노는 거 재밌어!`,"헤헤 간지러워!",`나는 ${o.name}야!`]),1500);burst("💗",1,{x:buddyX,y:40});return;
    }
    if(e.target.closest("#petWrap"))return;
    const rc=screen.getBoundingClientRect();
    const x=(e.clientX-rc.left)/rc.width*100,y=(e.clientY-rc.top)/rc.height*100;
    const ring=document.createElement("span");ring.className="tap-ring";ring.style.left=x+"%";ring.style.top=y+"%";$("#fx").appendChild(ring);setTimeout(()=>ring.remove(),520);
    if(p.sleeping){toast("쉿! 자고 있어요 🤫");return}
    if(p.sick){anim("shiver",700);say("아파서 못 걸어요…",1300);SFX.play("no");return}
    walkTo(x,p.energy<25?90:38);
    if(Math.random()<0.4)setTimeout(()=>{if(!dragging)setMood("happy",900)},Math.abs(x-petX)*38);
  });
})();
function tapPet(p){
  if(p.sleeping){SFX.play("pat");anim("sway",1800);toast("쉿! 자고 있어요 🤫");return}
  if(p.sick){anim("shiver",900);SFX.play("cough");say("콜록… 약 주세요",1400);return}
  hop();burst("💗",2,{y:40});SFX.play("boing");setMood(pick(["happy","wink","surprised"]),1000);
  const lines=[`안녕 ${PETS[p.slot].owner}야!`,"헤헤, 간지러워요!",`나는 ${p.name}!`,"오늘도 같이 놀자!","사랑해요 💕"];
  say(needOf(p)||pick(lines),1500);
}

/* ---------- persistence ---------- */
let dbDoc=null,cloudTimer=null,cloudBusy=false,cloudAgain=false;
function loadLocal(){try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function persist(){state.savedAt=Date.now();saveLocal();if(dbDoc){clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,2500)}}
async function pushCloud(){
  if(!dbDoc)return;if(cloudBusy){cloudAgain=true;return}
  cloudBusy=true;
  try{await dbDoc.set({state:JSON.parse(JSON.stringify(state)),savedAt:state.savedAt})}
  catch(e){if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted"))dbDoc=null}
  cloudBusy=false;if(cloudAgain){cloudAgain=false;pushCloud()}
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbDoc=db.doc("data/users/"+id+"/tamagotchi");
    const snap=await dbDoc.get();
    const d=snap.exists?snap.data():null;
    if(d&&d.state&&(d.savedAt||0)>(state.savedAt||0)&&d.state.pets){
      state=JSON.parse(JSON.stringify(d.state));fixPet(state.pets.rabbit,"rabbit");fixPet(state.pets.cat,"cat");catchUp();saveLocal();
      if(state.pets.rabbit&&state.pets.cat){showMain();if(isPaused())showPause();else $("#pauseScreen").hidden=true}else showSetup();
    }else if(state.pets.rabbit||state.pets.cat){pushCloud()}
  }catch(e){dbDoc=null}
}

/* ---------- rest time (pause) ---------- */
function pauseGame(reason){
  const P=parentOf();
  if(sheetOpen)closeSheet();
  if(!P.paused){P.paused=true;P.pausedAt=Date.now();P.reason=reason||"button";SFX.play("sleep");persist()}
  showPause();render();
}
function resumeGame(){
  const P=parentOf(),now=Date.now();
  P.paused=false;P.reason="";
  ["rabbit","cat"].forEach(t=>{const p=state.pets[t];if(p)p.lastTick=now});
  lastPlayTick=now;
  $("#pauseScreen").hidden=true;$("#pauseScreen").innerHTML="";
  persist();render();SFX.play("wake");toast("다시 만나서 반가워요! 💕");
}
function showPause(){
  const P=parentOf(),el=$("#pauseScreen");
  const r=state.pets.rabbit,c=state.pets.cat;
  const names=[r&&r.name,c&&c.name].filter(Boolean);
  const who=names.length===2?`${josa(names[0],"와","과")} ${names[1]}`:names[0]||"동물 친구들";
  const timeUp=P.reason==="limit";
  el.innerHTML=`<div class="moon">🌙 ✨</div>
    <div class="p-pets">${r?`<div>${petSVG(r.type,r.stage,"sleep",{blanket:true,wear:r.wear})}</div>`:""}${c?`<div>${petSVG(c.type,c.stage,"sleep",{blanket:true,wear:c.wear})}</div>`:""}</div>
    <h2>${timeUp?"오늘 놀 시간이 끝났어요!":"지금은 쉬는 시간이에요"}</h2>
    <p>${esc(who)}${josa(who,"이는","는").slice(who.length)} 코- 자고 있어요.<br>쉬는 동안에는 배도 안 고프고 아프지도 않아요. 다음에 또 만나요!</p>
    <p class="p-time">오늘 논 시간 ${Math.round((P.ms||0)/60000)}분${P.limitMin?` · 하루 ${P.limitMin}분까지`:""}</p>
    <button class="big-btn soft" type="button" id="parentOpen">어른이 다시 열기 🔑</button>
    <div class="parent-box" id="parentBox" hidden></div>`;
  el.hidden=false;
  $("#parentOpen").addEventListener("click",askParent);
}
function askParent(){
  const a=randi(12,19),b=randi(6,9);
  const box=$("#parentBox");box.hidden=false;$("#parentOpen").hidden=true;
  box.innerHTML=`<label for="parentAns">어른 확인: ${a} × ${b} = ?</label>
    <div class="pb-row"><input id="parentAns" inputmode="numeric" autocomplete="off"><button class="big-btn" type="button" id="parentOk">확인</button></div>
    <p class="err" id="parentErr"></p>`;
  const ok=()=>{
    if(parseInt($("#parentAns").value,10)===a*b)parentPanel();
    else{$("#parentErr").textContent="답이 달라요. 어른에게 부탁해 주세요";$("#parentAns").value=""}
  };
  $("#parentOk").addEventListener("click",ok);
  $("#parentAns").addEventListener("keydown",e=>{if(e.key==="Enter")ok()});
  $("#parentAns").focus();
}
function parentPanel(){
  const P=parentOf(),box=$("#parentBox");
  const opts=[0,15,30,45,60];
  const over=P.limitMin&&leftMs()<=0;
  box.innerHTML=`<span class="lbl">하루 놀이 시간</span>
    <div class="limit-opts">${opts.map(m=>`<button class="tool${(P.limitMin||0)===m?" on":""}" type="button" data-min="${m}">${m?m+"분":"제한 없음"}</button>`).join("")}</div>
    <p style="font-size:14px">${P.limitMin?`하루 ${P.limitMin}분이 지나면 저절로 쉬는 시간이 돼요. 날짜가 바뀌면 다시 놀 수 있어요.`:"시간 제한 없이 놀아요. 그만할 때는 위의 ⏸ 쉬는 시간 버튼을 눌러요."}${over?"<br>지금 다시 놀기를 누르면 15분 더 놀 수 있어요.":""}</p>
    <button class="big-btn" type="button" id="resumeBtn">다시 놀기 ▶</button>`;
  box.querySelectorAll("[data-min]").forEach(b=>b.addEventListener("click",()=>{P.limitMin=+b.dataset.min;P.warned=false;persist();parentPanel()}));
  $("#resumeBtn").addEventListener("click",()=>{
    if(P.limitMin&&leftMs()<=0)P.bonus=(P.bonus||0)+(-leftMs())+15*60000;
    P.warned=false;resumeGame();
  });
}
$("#pauseBtn").addEventListener("click",()=>{
  SFX.play("tap");
  openSheet(`<h2>⏸ 쉬는 시간</h2><p class="sub">게임을 멈추고 동물들을 재워요. 쉬는 동안에는 배도 안 고프고 아프지도 않아요.<br>다시 하려면 어른이 열어 줘야 해요.</p>
    <div class="row-btns"><button class="big-btn" type="button" id="doPause">쉬기 🌙</button><button class="big-btn soft" type="button" id="noPause">조금 더 놀래요</button></div>`);
  $("#doPause").addEventListener("click",()=>pauseGame("button"));
  $("#noPause").addEventListener("click",()=>closeSheet());
});

/* ---------- wiring ---------- */
buildStats();
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{if(busy||dragging)return;SFX.play("tap");if(state.current===t.dataset.pet)return;state.current=t.dataset.pet;lastPetKey="";lastPoopKey="";buddyKey="";temp=null;sayUntil=0;if(together()){const x=petX;placePet(buddyX,true);placeBuddy(x,true)}else placePet(50,true);setDir(1);saveLocal();render()}));
$("#actions").addEventListener("click",e=>{const b=e.target.closest(".act");if(!b||busy||dragging||b.disabled)return;const p=cur();if(p)ACTIONS[b.dataset.act](p)});
$("#settingsBtn").addEventListener("click",()=>{SFX.play("tap");openSettings()});
function syncSnd(){
  const b=$("#sndBtn");b.classList.toggle("off",SFX.muted);b.setAttribute("aria-label",SFX.muted?"효과음 켜기":"효과음 끄기");
  const m=$("#musicBtn");m.classList.toggle("off",BGM.muted);m.setAttribute("aria-label",BGM.muted?"배경음악 켜기":"배경음악 끄기");
}
$("#sndBtn").addEventListener("click",()=>{SFX.toggle();syncSnd()});
$("#musicBtn").addEventListener("click",()=>{BGM.toggle();syncSnd()});
syncSnd();
const unlockAudio=()=>{getCtx();BGM.unlock()};
["pointerdown","touchend","click","keydown"].forEach(t=>document.addEventListener(t,unlockAudio,true));
document.addEventListener("visibilitychange",()=>{
  BGM.pause(document.hidden);
  if(document.hidden){saveLocal();if(dbDoc&&(state.pets.rabbit||state.pets.cat)){clearTimeout(cloudTimer);pushCloud()}}
});

let saveCount=0;
let lastPlayTick=0;
function tick(){
  const now=Date.now(),ev=[];
  rollDay();
  const P=parentOf();
  if(P.paused){["rabbit","cat"].forEach(t=>{const p=state.pets[t];if(p)p.lastTick=now});BGM.set("none");lastPlayTick=now;return}
  if(!$("#main").hidden&&!document.hidden&&lastPlayTick)P.ms=(P.ms||0)+Math.min(5000,now-lastPlayTick);
  lastPlayTick=now;
  if(P.limitMin&&!$("#main").hidden){
    const left=leftMs();
    if(left<=120000&&left>0&&!P.warned){P.warned=true;toast("2분 남았어요! 이제 마무리해요 ⏰");SFX.play("ding")}
    if(left<=0&&!busy&&!dragging){pauseGame("limit");return}
  }
  ["rabbit","cat"].forEach(t=>{const p=state.pets[t];if(!p)return;
    const mins=(now-p.lastTick)/60000;p.lastTick=now;
    const e=[];simulate(p,Math.min(mins,150),e);if(t===state.current)ev.push(...e)});
  SLOTS.forEach(t=>{const q=state.pets[t];if(q)recordGrowth(q)});
  if(!cur()||$("#main").hidden){render();return}
  const p=cur();
  if(ev.includes("poop")){poopShow(p);toast("뿌직! 똥 쌌어요 💩 치워 주세요");persist()}
  if(ev.includes("sick")){SFX.play("sick");anim("shiver",1500);toast(`${josa(p.name,"이가","가")} 아파요! 치료해 주세요 💊`);persist()}
  if(ev.includes("woke")){SFX.play("wake");anim("stretch",1000);say("잘 잤다!",1500);toast("잘 잤다! 기운이 가득해요 ☀️");persist()}
  render();
  if(++saveCount%10===0)saveLocal();
}

function start(data){
  const hot=data&&data.state;
  const local=hot||loadLocal();
  if(local&&local.pets){state=local;if(!state.current)state.current="rabbit"}
  fixPet(state.pets.rabbit,"rabbit");fixPet(state.pets.cat,"cat");
  catchUp();
  rollDay();
  if(state.pets.rabbit&&state.pets.cat){if(!state.pets[state.current])state.current="rabbit";showMain();if(isPaused())showPause()}else showSetup();
  setInterval(tick,1000);
  setTimeout(behave,2500);
  setTimeout(blinkLoop,3000);
  setTimeout(buddyLoop,4000);
  initCloud();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
